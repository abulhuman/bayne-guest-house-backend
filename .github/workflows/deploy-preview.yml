name: Deploy PR preview

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # The same merge commit that passed CI is also the preview build context.
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The host pulls only the layers it lacks, so a PR that leaves package-lock.json
      # alone moves tens of megabytes over the host's link instead of the whole image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Deploy the tested preview image
        id: deploy
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | join(" ")')
          if [[ "$status" != "open $HEAD_SHA" ]]; then
            echo "Skipping a closed or superseded PR preview."
            exit 0
          fi
          image="ghcr.io/$REPOSITORY:pr-$PR_NUMBER-$HEAD_SHA"
          # A private config keeps the registry token off the runner's shared Docker config.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-$PR_NUMBER"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          docker tag "$image" "almis-backend:pr-$PR_NUMBER-$HEAD_SHA"
          # Use the trusted host script installed by main, never a PR's host scripts.
          python3 "$HOME/.local/share/almis/deploy/manage.py" preview \
            --pr "$PR_NUMBER" --image "almis-backend:pr-$PR_NUMBER-$HEAD_SHA"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Update the preview URL
        if: steps.deploy.outputs.deployed == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- almis-preview -->';
            const body = `${marker}\nPreview: https://pr-${issue_number}-api.almishotel.com\nThis preview has its own empty database and is removed when the PR closes.`;
            const params = { ...context.repo, issue_number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  teardown:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ github.event.repository.name }}
    steps:
      - name: Remove the preview and disposable database
        run: |
          python3 "$HOME/.local/share/almis/deploy/manage.py" remove-preview --pr "$PR_NUMBER"
          # Drop both tags the deploy step created, or the image stays on disk.
          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E "^(ghcr.io/$GITHUB_REPOSITORY|almis-backend):pr-$PR_NUMBER-" | xargs -r docker image rm
      - name: Delete closed PRs' images from the registry
        run: |
          set -euo pipefail
          versions="users/$OWNER/packages/container/$PACKAGE/versions"
          # List every page before deleting, or deletions shift versions into pages already read.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq '.[].number' > "$RUNNER_TEMP/open-prs"
          gh api --paginate "$versions" --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' \
            > "$RUNNER_TEMP/versions"
          # Delete every closed PR's versions, but GHCR refuses to delete the last tagged one,
          # so keep the newest when nothing else would remain.
          ids=$(python3 - "$RUNNER_TEMP/open-prs" "$RUNNER_TEMP/versions" <<'EOF'
          import re, sys
          open_prs = set(open(sys.argv[1]).read().split())
          tagged = [line.rstrip('\n').split('\t') for line in open(sys.argv[2]) if line.split('\t')[1].strip()]
          def closed(tags):
              return any((m := re.match(r'pr-(\d+)-', tag)) and m[1] not in open_prs for tag in tags.split(','))
          stale = [id for id, tags in tagged if closed(tags)]
          print('\n'.join(stale[1:] if len(stale) == len(tagged) else stale))
          EOF
          )
          for id in $ids; do gh api -X DELETE "$versions/$id"; done
