name: CI

permissions:
  contents: read

concurrency:
  # A group holds one pending run, so a shared push group would let a newer push replace an untested one.
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bgh_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bgh_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bunx jest
      - run: bunx prisma migrate deploy
      - run: bun run test:integration

  # Production deploys a release tag, not every merge. Re-run this workflow on an
  # older tag to roll back: gh workflow run CI --ref v1.2.3
  deploy-main:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: test
    uses: ./.github/workflows/deploy-main.yml
    permissions:
      contents: read
      actions: read

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    uses: ./.github/workflows/deploy-preview.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
